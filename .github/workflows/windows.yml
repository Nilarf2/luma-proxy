name: Windows release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Verify service request policy
        run: dotnet run --project service/tests/Policy.Tests.csproj -c Release
      - name: Build protected Windows service
        run: dotnet publish service/Luma.Service.csproj -c Release -r win-x64 --self-contained true -o resources/service
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run core:win
      - name: Verify protected service and real TUN lifecycle
        run: node scripts/service-smoke.mjs
      - name: Install media helper Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Verify media helper using loopback fixtures
        shell: pwsh
        run: |
          Get-Content media/upstream/SHA256SUMS.upstream | ForEach-Object {
            if ($_ -notmatch '^([a-f0-9]{64})  (src/[a-z_]+\.rs)$') { throw 'Invalid source manifest' }
            $expected = $Matches[1]
            $source = Join-Path media/upstream $Matches[2]
            if ((Get-FileHash $source -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw "Upstream media source mismatch: $source" }
          }
          cargo +1.99.1 test --locked --manifest-path media/Cargo.toml
      - name: Build isolated media helper
        shell: pwsh
        run: |
          cargo +1.99.1 build --locked --release --manifest-path media/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force resources/media | Out-Null
          Copy-Item media/target/release/luma-media.exe resources/media/luma-media.exe
      - run: npm run build
      - run: npx electron-builder --win --x64 --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npm run test:windows
      - run: npx electron-builder --win --x64 --prepackaged release/win-unpacked --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify PE and record checksums
        shell: pwsh
        run: |
          Get-ChildItem release/*.exe | ForEach-Object {
            $bytes = [IO.File]::ReadAllBytes($_.FullName)
            if ($bytes[0] -ne 77 -or $bytes[1] -ne 90) { throw 'Invalid EXE' }
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Append -Encoding ascii release/SHA256SUMS.txt
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Luma-Windows-x64
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          retention-days: 30

[package]
name = "luma-media"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[[bin]]
name = "luma-media"
path = "src/main.rs"

[dependencies]
clash-verge-media-unlock = { path = "upstream" }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "cookies", "gzip", "rustls", "form"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "time", "sync"] }

[package]
name = "clash-verge-media-unlock"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
clash-verge-logging = { path = "../logging" }
chrono = "=0.4.45"
log = "=0.4.34"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "cookies", "gzip", "rustls", "form"] }
rust_iso3166 = "=0.2.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "time", "sync"] }
